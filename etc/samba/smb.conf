# The host's Samba - installed by windows-vm (install.sh). It serves ONE share, to ONE client: the
# Windows VM at 192.168.122.10 on libvirt's NAT network, which maps it as S:.
# Never on the LAN: listens on lo + virbr0 only, allows only 127.0.0.1 and the VM, no guest, no NetBIOS.
# The previous file is kept as /etc/samba/smb.conf.pre-windows-vm.

[global]
   workgroup = WORKGROUP
   server role = standalone server
   server string = Garuda (Windows VM share)
   interfaces = lo virbr0
   bind interfaces only = yes
   hosts allow = 127.0.0.1 192.168.122.10
   hosts deny = ALL
   disable netbios = yes
   smb ports = 445
   server min protocol = SMB3
   server signing = mandatory
   security = user
   passdb backend = tdbsam
   map to guest = Never
   restrict anonymous = 2
   usershare max shares = 0
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log file = /var/log/samba/%m.log
   max log size = 1000

[Shared]
   comment = Garuda's ~/Shared (S: on the Windows half) - for the Windows VM only
   path = /home/jxn/Shared
   valid users = jxn
   force user = jxn
   force group = jxn
   read only = no
   browseable = yes
   create mask = 0644
   directory mask = 0755
   # The drive is NTFS (ntfs3): write no Samba xattrs/EAs onto it.
   store dos attributes = no
   ea support = no
   map archive = no
   map hidden = no
   map system = no
