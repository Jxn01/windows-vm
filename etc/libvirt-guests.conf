# /etc/conf.d/libvirt-guests - installed by windows-vm.
# What happens to running VMs when the host shuts down and boots.
URIS=qemu:///system
# Never auto-start a VM at boot (the default `start` would restart the Windows VM after every reboot).
ON_BOOT=ignore
# Shut guests down cleanly. The default, `suspend`, is a managed save: Windows' RAM saved with C: in use - booting
# the hardware Windows afterwards and then resuming would corrupt C:. (QEMU refuses that save anyway: invtsc.)
ON_SHUTDOWN=shutdown
SHUTDOWN_TIMEOUT=300
PARALLEL_SHUTDOWN=0
START_DELAY=0
BYPASS_CACHE=0
SYNC_TIME=0
