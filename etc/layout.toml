# The real system disk's partition table, as read live.
#
# winvm compares the LIVE partition table against this file before every VM start and refuses on ANY
# difference (GPT drift). If the disk is repartitioned on purpose, re-record it with
# `sudo winvm-root layout record > etc/layout.toml`, review the diff, commit, and reinstall.
#
# Roles:
#   esp     -> the VM gets a PRIVATE copy at the same LBA/size (never the real ESP)
#   mapped  -> the VM's sector N is the real partition's sector N (dm linear, identity offsets)
#   absent  -> the entry is blanked in the VM's table and its sectors read as zeros (dm zero)
# windows_side = true: a Windows partition; the pre-flight refuses while it is mounted, swap or claimed
#   (the host's own root and the shared ESP are false - they are mounted by design and never mapped).
# Every partition on the disk must be listed; an unlisted one is drift.

[disk]
by_id = "/dev/disk/by-id/nvme-KINGSTON_SFYR2S4T0_50026B7283A6141C"
logical_block_size = 512
physical_block_size = 512
total_sectors = 8001573552
disk_guid = "0897a6e9-ad1d-41ce-a152-026976da8cae"
first_usable_lba = 2048
last_usable_lba = 8001573518
num_entries = 128
entry_size = 128
# The partition holding Windows itself (C:); the pre-flight reads its NTFS state.
windows_partition = 5

[[partition]]
number = 1
windows_side = false
role = "esp"
what = "EFI system partition (GRUB + Windows Boot Manager; /boot/efi on Garuda)"
type_guid = "c12a7328-f81f-11d2-ba4b-00a0c93ec93b"
unique_guid = "2b8dfc56-508d-4e0e-9914-8c1edd067549"
