# /etc/systemd/system/libvirt-guests.service.d/windows-vm.conf - installed by ~/Projects/windows-vm.
# At shutdown systemd stops units in REVERSE start order. Ordering libvirt-guests after the libvirt daemon and
# Samba makes it stop FIRST: the VM is shut down while the daemon can still drive it and while S: (Samba) is
# still served. Upstream orders it only after the daemons' sockets. Garuda runs the monolithic libvirtd
# (socket-activated); virtqemud is listed too so the order survives a switch to the modular daemons.
[Unit]
Wants=libvirtd.service
After=libvirtd.service virtqemud.service smb.service network-online.target
